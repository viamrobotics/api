syntax = "proto3";

package viam.service.statemachine.v1;

import "common/v1/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "service/task/v1/task.proto";

option go_package = "go.viam.com/api/service/statemachine/v1";
option java_package = "com.viam.service.statemachine.v1";

// A StateMachineService runs a configured graph of states. Each state may run
// one task; when that task returns an outcome, or an event arrives, the
// machine looks up the transition and enters the next state. States nest: a
// mode is a state that contains a sub-machine. The machine exposes where it
// is, accepts events, and shows its history.
service StateMachineService {
  // GetState returns the active state path, the machine status, the context
  // and the running task's latest progress.
  rpc GetState(GetStateRequest) returns (GetStateResponse) {
    option (google.api.http) = {get: "/viam/api/v1/service/state_machine/{name}/state"};
  }

  // SendEvent delivers an external event. An event with no matching transition
  // in the current state or any ancestor is dropped and logged; the response
  // then says handled: false. Events are never queued.
  rpc SendEvent(SendEventRequest) returns (SendEventResponse) {
    option (google.api.http) = {post: "/viam/api/v1/service/state_machine/{name}/event"};
  }

  // GetHistory returns the most recent `limit` transitions, oldest first.
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse) {
    option (google.api.http) = {get: "/viam/api/v1/service/state_machine/{name}/history"};
  }

  // GetDefinition returns the machine's states and the triggers each one
  // handles, as configured. The app renders it; an agent reads it to learn
  // which events exist.
  rpc GetDefinition(GetDefinitionRequest) returns (GetDefinitionResponse) {
    option (google.api.http) = {get: "/viam/api/v1/service/state_machine/{name}/definition"};
  }

  // GetCurrentJobId returns the id of the machine's current job. A new job
  // starts each time the machine enters its initial state from the outside:
  // at startup and on Reset.
  rpc GetCurrentJobId(GetCurrentJobIdRequest) returns (GetCurrentJobIdResponse) {
    option (google.api.http) = {get: "/viam/api/v1/service/state_machine/{name}/job_id"};
  }

  // Stop cancels the current task and holds the machine in its current state
  // until Reset or an event with a transition out.
  rpc Stop(StopRequest) returns (StopResponse) {
    option (google.api.http) = {post: "/viam/api/v1/service/state_machine/{name}/stop"};
  }

  // Reset cancels the current task, clears the context back to its configured
  // value and re-enters the initial state.
  rpc Reset(ResetRequest) returns (ResetResponse) {
    option (google.api.http) = {post: "/viam/api/v1/service/state_machine/{name}/reset"};
  }

  // DoCommand sends/receives arbitrary commands
  rpc DoCommand(common.v1.DoCommandRequest) returns (common.v1.DoCommandResponse) {
    option (google.api.http) = {post: "/viam/api/v1/service/state_machine/{name}/do_command"};
  }

  // GetStatus returns the status of the resource
  rpc GetStatus(common.v1.GetStatusRequest) returns (common.v1.GetStatusResponse) {
    option (google.api.http) = {get: "/viam/api/v1/service/state_machine/{name}/get_status"};
  }
}

// Status is whether the machine is driving its graph.
enum Status {
  STATUS_UNSPECIFIED = 0;
  // The machine enters states and runs their tasks.
  STATUS_RUNNING = 1;
  // Stop was called: the machine holds its state and runs nothing until Reset
  // or an event with a transition out.
  STATUS_STOPPED = 2;
  // A task returned an outcome no state handles, or would not cancel in time.
  // The machine runs nothing until Reset or an event with a transition out.
  STATUS_FAULTED = 3;
}

// TransitionSource is what kind of thing caused a transition.
enum TransitionSource {
  TRANSITION_SOURCE_UNSPECIFIED = 0;
  // The machine entered its initial state at startup.
  TRANSITION_SOURCE_INITIAL = 1;
  // The task running in the from state returned the outcome named by trigger.
  TRANSITION_SOURCE_OUTCOME = 2;
  // SendEvent, or a watcher, raised the event named by trigger.
  TRANSITION_SOURCE_EVENT = 3;
  // The from state's timeout elapsed; trigger is "timeout".
  TRANSITION_SOURCE_TIMEOUT = 4;
  // Stop held the machine; from and to are equal and trigger is "stop".
  TRANSITION_SOURCE_STOP = 5;
  // Reset re-entered the initial state; trigger is "reset".
  TRANSITION_SOURCE_RESET = 6;
  // The machine faulted; from and to are equal, trigger is "fault" and
  // task_result carries the reason.
  TRANSITION_SOURCE_FAULT = 7;
}

// Transition is one recorded change of active state.
message Transition {
  // The active state path before the transition. Empty for the initial entry.
  repeated string from = 1;
  // The active state path after the transition.
  repeated string to = 2;
  // The outcome or event name that caused it, or "initial", "timeout",
  // "stop", "reset" or "fault" as source says.
  string trigger = 3;
  google.protobuf.Timestamp timestamp = 4;
  // The result of the task that was running in the from state, if it finished.
  viam.service.task.v1.Result task_result = 5;
  // What kind of thing caused the transition. An outcome name sent through
  // SendEvent is recorded as an event, so history shows the override.
  TransitionSource source = 6;
  // The job the transition belongs to.
  string job_id = 7;
}

message GetStateRequest {
  // Name of the state machine service
  string name = 1;
  // Additional arguments to the method
  google.protobuf.Struct extra = 99;
}

message GetStateResponse {
  // The active state path from the root, e.g. ["auto", "pour", "picking_glass"].
  repeated string path = 1;
  Status status = 2;
  google.protobuf.Struct context = 3;
  // When the innermost active state was entered.
  google.protobuf.Timestamp entered_at = 4;
  // The running task's latest progress. Unset when no task is running.
  viam.service.task.v1.Progress task_progress = 5;
  // The current job, read together with the state so the two cannot straddle
  // a Reset.
  string job_id = 6;
}

message SendEventRequest {
  // Name of the state machine service
  string name = 1;
  // The event name, as written in a state's "on" map.
  string event = 2;
  // Event payload. The target state's task receives the machine's context
  // shallowly merged with this payload, payload keys winning, as its input.
  // The payload is not stored in the context: it reaches that one task only.
  google.protobuf.Struct payload = 3;
  // Additional arguments to the method
  google.protobuf.Struct extra = 99;
}

message SendEventResponse {
  // Whether a transition matched the event.
  bool handled = 1;
  // The active state path after the event was processed.
  repeated string path = 2;
}

message GetHistoryRequest {
  // Name of the state machine service
  string name = 1;
  // Maximum number of transitions to return; the most recent ones are kept.
  // 0 means all retained.
  int32 limit = 2;
  // Additional arguments to the method
  google.protobuf.Struct extra = 99;
}

message GetHistoryResponse {
  // The most recent transitions, oldest first.
  repeated Transition transitions = 1;
}

message GetDefinitionRequest {
  // Name of the state machine service
  string name = 1;
  // Additional arguments to the method
  google.protobuf.Struct extra = 99;
}

// StateDefinition is one state of the machine as configured.
message StateDefinition {
  // The state's path from the root, e.g. ["auto", "pour", "picking_glass"].
  repeated string path = 1;
  // The child state entered first, for a compound state. Empty for a leaf.
  string initial = 2;
  // The triggers (task outcomes and event names) this state handles, mapped
  // to the target state name as written in config ("$history" and "$done"
  // are the special targets).
  map<string, string> on = 3;
  // The name of the task resource the state runs. Empty when it runs none.
  string task = 4;
  // How long the state's task may run before it is cancelled and the state
  // handles "timeout". Unset when the state has no timeout.
  google.protobuf.Duration timeout = 5;
}

message GetDefinitionResponse {
  // The name of the top-level state entered on start and on Reset.
  string initial = 1;
  // Every state, compound states included, in no particular order.
  repeated StateDefinition states = 2;
  // Every trigger any state or the machine itself handles. Task outcomes and
  // external events share this namespace by design: sending an outcome name
  // through SendEvent forces the transition a task would have caused, and
  // history records it with source EVENT so the override is visible.
  repeated string events = 3;
  // Triggers the machine handles at its top level, mapped to target state names.
  map<string, string> on = 4;
}

message GetCurrentJobIdRequest {
  // Name of the state machine service
  string name = 1;
  // Additional arguments to the method
  google.protobuf.Struct extra = 99;
}

message GetCurrentJobIdResponse {
  string job_id = 1;
}

message StopRequest {
  // Name of the state machine service
  string name = 1;
  // Additional arguments to the method
  google.protobuf.Struct extra = 99;
}

message StopResponse {}

message ResetRequest {
  // Name of the state machine service
  string name = 1;
  // Additional arguments to the method
  google.protobuf.Struct extra = 99;
}

message ResetResponse {}
