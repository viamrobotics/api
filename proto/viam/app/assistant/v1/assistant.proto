syntax = "proto3";

package viam.app.assistant.v1;

import "google/protobuf/timestamp.proto";

option go_package = "go.viam.com/api/app/assistant/v1";

// AppAssistantService is the chat on the web app and on Viam mobile.
// The server owns the transcript. Auth is the caller's existing app credential.
service AppAssistantService {
  // One turn. Events arrive as the model writes. The stream ends on complete
  // or on client_tool.
  rpc StreamTurn(StreamTurnRequest) returns (stream TurnEvent);

  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);

  // The models a caller can pick for a conversation, in display order.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
}

// Ids the screen has. Every field is optional. A tool is enabled when the fields it
// requires are set. Further down the screen, the client sets more of them.
// More fields can be added later.
message ConversationContext {
  string organization_id = 1;
  string location_id = 2;
  // The machine. Named robot to match viam.app.v1.
  string robot_id = 3;
  string part_id = 4;
  string fragment_id = 5;
}

message StreamTurnRequest {
  // Empty creates a conversation. The first event returns the id.
  string conversation_id = 1;
  ConversationContext context = 2;
  oneof input {
    string user_message = 3;
    ClientToolResult client_tool_result = 4;
  }
  // A model id from ListModels. The conversation keeps it for later turns. Empty keeps the
  // conversation's model; a new conversation then uses the default.
  string model = 5;
}

// Result of a client tool the caller ran after a client_tool event.
message ClientToolResult {
  string tool_use_id = 1;
  string content = 2;
  bool is_error = 3;
}

message TurnEvent {
  oneof event {
    ConversationStarted conversation = 1;
    TextDelta text_delta = 2;
    // A backend tool running inside this turn, such as "Reading logs".
    ToolStatus tool_status = 3;
    // A tool only the client can run. The client that sent the context runs it.
    ClientTool client_tool = 4;
    TurnComplete complete = 5;
    // The model that served the turn and the organization's AI cost this month. Sent after the
    // model ran, before complete or client_tool.
    TurnUsage usage = 6;
  }
}

message ConversationStarted {
  string conversation_id = 1;
}

message TextDelta {
  // Display only. The server stores the finished text.
  string text = 1;
}

message ToolStatus {
  string tool_name = 1;
  string label = 2;
}

message ClientTool {
  string tool_use_id = 1;
  string name = 2;
  string input_json = 3;
}

message TurnComplete {
  // "end_turn" | "max_tokens" | "model_context_window_exceeded"
  string stop_reason = 1;
}

message TurnUsage {
  // The model that served the turn's last call. It differs from the requested model when the
  // provider fell back to another one.
  string served_model = 1;
  // Month-to-date USD of AI usage for the organization that pays for this conversation, after the
  // tier's credit. Unset when the caller may not see that organization's billing.
  optional double organization_month_cost_usd = 2;
}

message ListConversationsRequest {
  // Optional filter. Empty lists the caller's conversations.
  string organization_id = 1;
}

message ConversationListItem {
  string conversation_id = 1;
  string title = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message ListConversationsResponse {
  // Newest updated_at first. Clients must not assume an unsorted list.
  repeated ConversationListItem conversations = 1;
}

message GetConversationRequest {
  string conversation_id = 1;
}

message TranscriptMessage {
  // "user" or "assistant". Visible text only.
  string role = 1;
  string text = 2;
  google.protobuf.Timestamp created_at = 3;
}

message GetConversationResponse {
  repeated TranscriptMessage messages = 1;
  // Set when a turn is waiting on the client to run a tool. Empty otherwise.
  ClientTool open_client_tool = 2;
  // The context stored with the conversation. Empty fields were never set.
  ConversationContext context = 3;
  // The model id the conversation uses. Empty means the default.
  string model = 4;
}

message ListModelsRequest {
  // The organization whose assistant settings apply.
  string organization_id = 1;
}

message Model {
  // Pass this as StreamTurnRequest.model.
  string id = 1;
  string label = 2;
  string description = 3;
}

message ListModelsResponse {
  repeated Model models = 1;
  // The id a conversation uses until the caller picks another.
  string default_model = 2;
}
