syntax = "proto3";

package viam.service.worldstatestore.v1;

import "common/v1/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";

option go_package = "go.viam.com/api/service/worldstatestore/v1";
option java_package = "com.viam.service.worldstatestore.v1";

service WorldStateStoreService {
  // ListUUIDs returns all world state transform UUIDs
  rpc ListUUIDs(ListUUIDsRequest) returns (ListUUIDsResponse) {}

  // GetTransform returns a world state transform by uuid
  rpc GetTransform(GetTransformRequest) returns (GetTransformResponse) {}

  // ListTransforms returns a snapshot of every transform in the world state, as it was when the request was received.
  //
  // The snapshot is consistent: it includes all transforms in the world state at the time of the request, and no 
  // change made after the request was received.
  //
  // A world state can be large, so the snapshot is sent as a stream of batches rather than as one message, and the
  // call can be slow. The stream ends once the whole snapshot has been sent. A stream that ends with an error is not
  // a complete snapshot and should be discarded.
  rpc ListTransforms(ListTransformsRequest) returns (stream ListTransformsResponse) {
    option (google.api.http) = {get: "/viam/api/v1/service/worldstatestore/{name}/list_transforms"};
  }

  // StreamTransformChanges streams changes to world state transforms
  rpc StreamTransformChanges(StreamTransformChangesRequest) returns (stream StreamTransformChangesResponse) {
    option (google.api.http) = {get: "/viam/api/v1/service/worldstatestore/{name}/stream_transform_changes"};
  }

  // ApplyTransformChanges applies a batch of additions, updates, and removals to the world state in a single call.
  //
  // Changes are applied in the order they appear in the request, and each change sees the effect of the changes
  // before it. A transform can therefore be replaced by removing it and then adding it again under the same UUID.
  //
  // The call is all-or-nothing: if any change is invalid, such as adding a UUID that already exists or updating or
  // removing one that does not, an error is returned and none of the changes in the request are applied.
  rpc ApplyTransformChanges(ApplyTransformChangesRequest) returns (ApplyTransformChangesResponse) {
    option (google.api.http) = {post: "/viam/api/v1/service/worldstatestore/{name}/apply_transform_changes"};
  }

  // DoCommand sends/receives arbitrary commands
  rpc DoCommand(common.v1.DoCommandRequest) returns (common.v1.DoCommandResponse) {
    option (google.api.http) = {post: "/viam/api/v1/service/worldstatestore/{name}/do_command"};
  }

  // GetStatus returns the status of the resource
  rpc GetStatus(common.v1.GetStatusRequest) returns (common.v1.GetStatusResponse) {
    option (google.api.http) = {get: "/viam/api/v1/service/worldstatestore/{name}/get_status"};
  }
}

message ListUUIDsRequest {
  // Name of the world object store service
  string name = 1;

  // Additional arguments to the method
  google.protobuf.Struct extra = 99;
}

message ListUUIDsResponse {
  repeated bytes uuids = 1;
}

message GetTransformRequest {
  // Name of the world object store service
  string name = 1;

  bytes uuid = 2;

  // Additional arguments to the method
  google.protobuf.Struct extra = 99;
}

message GetTransformResponse {
  common.v1.Transform transform = 2;
}

message ListTransformsRequest {
  // Name of the world object store service
  string name = 1;

  // Additional arguments to the method
  google.protobuf.Struct extra = 99;
}

message ListTransformsResponse {
  // One batch of the snapshot. The snapshot is every batch in the stream taken together; how transforms are split
  // into batches is up to the service and carries no meaning.
  repeated common.v1.Transform transforms = 1;
}

enum TransformChangeType {
  TRANSFORM_CHANGE_TYPE_UNSPECIFIED = 0;
  TRANSFORM_CHANGE_TYPE_ADDED = 1;
  TRANSFORM_CHANGE_TYPE_REMOVED = 2;
  TRANSFORM_CHANGE_TYPE_UPDATED = 3;
}

message StreamTransformChangesRequest {
  // Name of the world object store service
  string name = 1;

  // Additional arguments to the method
  google.protobuf.Struct extra = 99;
}

message StreamTransformChangesResponse {
  TransformChangeType change_type = 1;
  common.v1.Transform transform = 2;

  // The field mask of the transform that has changed, if any. For added transforms, this will be empty. For updated
  // transforms, this will be the fields that have changed. For removed transforms, this will be the transform's UUID
  // path.
  google.protobuf.FieldMask updated_fields = 3;
}

// TransformChange describes a single change to apply to the world state.
message TransformChange {
  // The kind of change to apply. TRANSFORM_CHANGE_TYPE_UNSPECIFIED is invalid.
  TransformChangeType change_type = 1;

  // The transform to apply the change to.
  // - ADDED: the complete transform to add, including its UUID.
  // - REMOVED: only the UUID needs to be set.
  // - UPDATED: the UUID of the transform to update, plus the new values for the fields listed in updated_fields.
  common.v1.Transform transform = 2;

  // Only used for updated transforms: the paths of the transform fields to overwrite with the values from transform.
  // If empty, the stored transform is replaced with transform in its entirety. Ignored for added and removed
  // transforms.
  google.protobuf.FieldMask updated_fields = 3;
}

message ApplyTransformChangesRequest {
  // Name of the world object store service
  string name = 1;

  // The changes to apply, in order. Either all of them are applied or none are.
  repeated TransformChange changes = 2;

  // Additional arguments to the method
  google.protobuf.Struct extra = 99;
}

message ApplyTransformChangesResponse {}
