syntax = "proto3";

package viam.component.gripper.v1;

import "common/v1/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

option go_package = "go.viam.com/api/component/gripper/v1";
option java_package = "com.viam.component.gripper.v1";

// An GripperService services all grippers associated with a robot
service GripperService {
  // Open opens a gripper of the underlying robot.
  rpc Open(OpenRequest) returns (OpenResponse) {
    option (common.v1.safety_heartbeat_monitored) = true;
    option (google.api.http) = {put: "/viam/api/v1/component/gripper/{name}/open"};
  }

  // Grab requests a gripper of the underlying robot to grab.
  rpc Grab(GrabRequest) returns (GrabResponse) {
    option (common.v1.safety_heartbeat_monitored) = true;
    option (google.api.http) = {put: "/viam/api/v1/component/gripper/{name}/grab"};
  }

  // Stop stops a robot's gripper
  rpc Stop(StopRequest) returns (StopResponse) {
    option (google.api.http) = {post: "/viam/api/v1/component/gripper/{name}/stop"};
  }

  // IsMoving reports if a component is in motion
  rpc IsMoving(IsMovingRequest) returns (IsMovingResponse) {
    option (google.api.http) = {get: "/viam/api/v1/component/gripper/{name}/is_moving"};
  }

  // IsHoldingSomething returns whether the gripper is currently holding onto an object
  rpc IsHoldingSomething(IsHoldingSomethingRequest) returns (IsHoldingSomethingResponse) {
    option (google.api.http) = {get: "/viam/api/v1/component/gripper/{name}/is_holding_something"};
  }

  // GetCurrentInputs returns the current input values of a gripper
  rpc GetCurrentInputs(GetCurrentInputsRequest) returns (GetCurrentInputsResponse) {
    option (google.api.http) = {get: "/viam/api/v1/component/gripper/{name}/inputs"};
  }

  // GoToInputs moves the gripper to the given input values.
  rpc GoToInputs(GoToInputsRequest) returns (GoToInputsResponse) {
    option (common.v1.safety_heartbeat_monitored) = true;
    option (google.api.http) = {put: "/viam/api/v1/component/gripper/{name}/inputs"};
  }

  // SetPercentOpen moves the gripper to a normalized opening, where 0.0 is fully closed (where
  // Grab moves to) and 1.0 is fully open (where Open moves to). The gripper maps the value
  // linearly onto its range of motion and owns any inversion of its hardware scale.
  // A percent_open that is NaN or outside 0.0-1.0 returns InvalidArgument.
  // This call blocks until the move completes or is stopped, like Open and Grab. Stop cancels it.
  rpc SetPercentOpen(SetPercentOpenRequest) returns (SetPercentOpenResponse) {
    option (common.v1.safety_heartbeat_monitored) = true;
    option (google.api.http) = {put: "/viam/api/v1/component/gripper/{name}/position"};
  }

  // GetPercentOpen returns the measured opening of the gripper on the same 0.0 (closed) to
  // 1.0 (open) scale as SetPercentOpen.
  rpc GetPercentOpen(GetPercentOpenRequest) returns (GetPercentOpenResponse) {
    option (google.api.http) = {get: "/viam/api/v1/component/gripper/{name}/position"};
  }

  // GetProperties returns the capabilities of the gripper.
  // A gripper that returns Unimplemented for GetProperties is treated as having
  // percent_open_supported = false.
  rpc GetProperties(GetPropertiesRequest) returns (GetPropertiesResponse) {
    option (google.api.http) = {get: "/viam/api/v1/component/gripper/{name}/properties"};
  }

  // DoCommand sends/receives arbitrary commands
  rpc DoCommand(common.v1.DoCommandRequest) returns (common.v1.DoCommandResponse) {
    option (google.api.http) = {post: "/viam/api/v1/component/gripper/{name}/do_command"};
  }

  // GetStatus returns the status of the resource
  rpc GetStatus(common.v1.GetStatusRequest) returns (common.v1.GetStatusResponse) {
    option (google.api.http) = {get: "/viam/api/v1/component/gripper/{name}/get_status"};
  }

  // GetGeometries returns the geometries of the component in their current configuration
  rpc GetGeometries(common.v1.GetGeometriesRequest) returns (common.v1.GetGeometriesResponse) {
    option (google.api.http) = {get: "/viam/api/v1/component/gripper/{name}/geometries"};
  }

  // GetKinematics returns the kinematics file for the component
  rpc GetKinematics(common.v1.GetKinematicsRequest) returns (common.v1.GetKinematicsResponse) {
    option (google.api.http) = {get: "/viam/api/v1/component/gripper/{name}/kinematics"};
  }
}

message OpenRequest {
  string name = 1;
  google.protobuf.Struct extra = 99;
}

message OpenResponse {}

message GrabRequest {
  string name = 1;
  google.protobuf.Struct extra = 99;
}

message GrabResponse {
  bool success = 1;
  google.protobuf.Struct extra = 99;
}

message StopRequest {
  // Name of a gripper
  string name = 1;
  google.protobuf.Struct extra = 99;
}

message StopResponse {}

message IsMovingRequest {
  string name = 1;
}

message IsMovingResponse {
  bool is_moving = 1;
}

message IsHoldingSomethingRequest {
  string name = 1;
  google.protobuf.Struct extra = 99;
}

message IsHoldingSomethingResponse {
  bool is_holding_something = 1;
  google.protobuf.Struct meta = 99;
}

message GetCurrentInputsRequest {
  // Name of a gripper
  string name = 1;
  // Additional arguments to the method
  google.protobuf.Struct extra = 99;
}

message GetCurrentInputsResponse {
  // The current input values of the gripper
  repeated double values = 1;
}

message GoToInputsRequest {
  // Name of a gripper
  string name = 1;
  // The input values to move the gripper to
  repeated double values = 2;
  // Additional arguments to the method
  google.protobuf.Struct extra = 99;
}

message GoToInputsResponse {}

message SetPercentOpenRequest {
  // Name of a gripper
  string name = 1;
  // The opening to move to, from 0.0 (fully closed) to 1.0 (fully open)
  double percent_open = 2;
  // Additional arguments to the method
  google.protobuf.Struct extra = 99;
}

message SetPercentOpenResponse {}

message GetPercentOpenRequest {
  // Name of a gripper
  string name = 1;
  // Additional arguments to the method
  google.protobuf.Struct extra = 99;
}

message GetPercentOpenResponse {
  // The measured opening, from 0.0 (fully closed) to 1.0 (fully open)
  double percent_open = 1;
}

message GetPropertiesRequest {
  // Name of a gripper
  string name = 1;
  // Additional arguments to the method
  google.protobuf.Struct extra = 99;
}

message GetPropertiesResponse {
  // True if the gripper supports SetPercentOpen and GetPercentOpen. False for any gripper that
  // cannot measure its opening.
  bool percent_open_supported = 1;
}
