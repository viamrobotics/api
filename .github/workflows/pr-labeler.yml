name: PR Test Label Manager

on:
  pull_request_target:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  pr_test_label_manager:
    # note: this doesn't gate on 'safe to test' label because it doesn't check out code
    name: PR Test Label Manager
    runs-on: ubuntu-latest
    steps:
      - name: "Check Membership and Label PR"
        uses: actions/github-script@v6
        id: check-membership
        with:
          # PR_TOKEN (PAT) so the label add below retriggers pullrequest.yml; GITHUB_TOKEN events don't.
          github-token: ${{ secrets.PR_TOKEN }}
          script: |
            let prNumber = context.payload.pull_request?.number;
            const ownerAndRepo = {
              // note: this is hardcoded because I'm not sure how it will vary in fork PRs
              owner: "viamrobotics",
              repo: "${{ github.event.repository.name }}",
            };
            const pr = context.payload.pull_request;
            const sender = context.payload.sender.login;
            // Non-member bots that push same-repo branches; forks never take this path.
            const trustedBots = ["dependabot[bot]", "viam-overwatch[bot]"];
            const isFork = pr.head.repo?.full_name !== pr.base.repo.full_name;
            let isAuthorized = !isFork && trustedBots.includes(sender);
            if (!isAuthorized) {
              try {
                // checkMembershipForUser returns 204 for members and throws a 404 for non-members.
                const orgResp = await github.rest.orgs.checkMembershipForUser({org: ownerAndRepo.owner, username: sender});
                isAuthorized = orgResp.status === 204;
              } catch (err) {
                core.info(`${sender} is not a viamrobotics org member: ${err}`);
              }
            }
            if (isAuthorized) {
              await github.rest.issues.addLabels({...ownerAndRepo, issue_number: prNumber, labels: ["safe to test"]});
              return true;
            }
            try {
              await github.rest.issues.removeLabel({...ownerAndRepo, issue_number: prNumber, name: "safe to test"});
            } catch (err) {
              core.info(`Non-fatal: could not remove 'safe to test' label: ${err}`);
            }
            return false;

      - name: Add Unsafe PR Comment
        if: steps.check-membership.outputs.result != 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message: For security reasons, this PR must be labeled with `safe to test` in order for tests to run.
