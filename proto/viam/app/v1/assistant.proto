syntax = "proto3";

package viam.app.v1;

import "google/protobuf/timestamp.proto";

option go_package = "go.viam.com/api/app/v1";

// The App assistant is the chat on the web app and on Viam mobile. Its RPCs are on AppService.
// The server owns the transcript. Auth is the caller's existing app credential.

// The ids the client is open on. Every field is optional. A tool is enabled when the fields it
// requires are set. Further into a machine or fragment, the client sets more of them.
message AssistantConversationContext {
  string organization_id = 1;
  string location_id = 2;
  // The machine. Named robot to match the rest of viam.app.v1.
  string robot_id = 3;
  string part_id = 4;
  string fragment_id = 5;
}

message StreamAssistantTurnRequest {
  // Empty creates a conversation. The first response returns the id.
  string conversation_id = 1;
  AssistantConversationContext context = 2;
  oneof input {
    string user_message = 3;
    AssistantClientToolResult client_tool_result = 4;
  }
  // A model id from ListAssistantModels. The conversation keeps it for later turns. Empty keeps the
  // conversation's model; a new conversation then uses the default.
  string model = 5;
}

// Result of a client tool the caller ran after a client_tool response.
message AssistantClientToolResult {
  string tool_use_id = 1;
  string content = 2;
  bool is_error = 3;
}

// One event of a turn. The stream ends on complete or on client_tool.
message StreamAssistantTurnResponse {
  oneof event {
    AssistantConversationStarted conversation = 1;
    AssistantTextDelta text_delta = 2;
    // A backend tool running inside this turn, such as "Reading logs".
    AssistantToolStatus tool_status = 3;
    // A tool only the client can run. The client that sent the context runs it.
    AssistantClientTool client_tool = 4;
    AssistantTurnComplete complete = 5;
    // The model that served the turn and the organization's AI cost this month. Sent after the
    // model ran, before complete or client_tool.
    AssistantTurnUsage usage = 6;
  }
}

message AssistantConversationStarted {
  string conversation_id = 1;
}

message AssistantTextDelta {
  // Display only. The server stores the finished text.
  string text = 1;
}

message AssistantToolStatus {
  string tool_name = 1;
  string label = 2;
}

message AssistantClientTool {
  string tool_use_id = 1;
  string name = 2;
  string input_json = 3;
}

message AssistantTurnComplete {
  // "end_turn" | "max_tokens" | "model_context_window_exceeded"
  string stop_reason = 1;
}

message AssistantTurnUsage {
  // The model that served the turn's last call. It differs from the requested model when the
  // provider fell back to another one.
  string served_model = 1;
  // Month-to-date USD of AI usage for the organization that pays for this conversation, after the
  // tier's credit. Unset when the caller may not see that organization's billing.
  optional double organization_month_cost_usd = 2;
}

message ListAssistantConversationsRequest {
  // Optional filter. Empty lists the caller's conversations.
  string organization_id = 1;
}

message AssistantConversationListItem {
  string conversation_id = 1;
  string title = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message ListAssistantConversationsResponse {
  // Newest updated_at first. Clients must not assume an unsorted list.
  repeated AssistantConversationListItem conversations = 1;
}

message GetAssistantConversationRequest {
  string conversation_id = 1;
}

message AssistantTranscriptMessage {
  // "user" or "assistant". Visible text only.
  string role = 1;
  string text = 2;
  google.protobuf.Timestamp created_at = 3;
}

message GetAssistantConversationResponse {
  repeated AssistantTranscriptMessage messages = 1;
  // Set when a turn is waiting on the client to run a tool. Empty otherwise.
  AssistantClientTool open_client_tool = 2;
  // The context stored with the conversation. Empty fields were never set.
  AssistantConversationContext context = 3;
  // The model id the conversation uses. Empty means the default.
  string model = 4;
}

message ListAssistantModelsRequest {
  // The organization whose assistant settings apply.
  string organization_id = 1;
}

message AssistantModel {
  // Pass this as StreamAssistantTurnRequest.model.
  string id = 1;
  string label = 2;
  string description = 3;
}

message ListAssistantModelsResponse {
  repeated AssistantModel models = 1;
  // The id a conversation uses until the caller picks another.
  string default_model = 2;
}
